[package]
name = "centelha-web"
description = "O site: páginas do livro geradas em HTML no build e ilhas de interatividade em WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# O gerador do site estático (grava dist/). Só existe com a feature `ssr`.
[[bin]]
name = "centelha-site"
path = "src/bin/site.rs"
required-features = ["ssr"]

# Prova 1 do ADR 0003: cada página tem o texto inteiro sem WebAssembly.
[[test]]
name = "full_text"
path = "tests/full_text.rs"
required-features = ["ssr"]

[features]
# Sem features padrão; `ssr` e `hydrate` nunca juntas.
ssr = ["leptos/ssr", "dep:centelha-data", "dep:pulldown-cmark", "dep:sha1", "dep:hydration_context"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
leptos = { workspace = true, features = ["islands"] }
serde.workspace = true
centelha-data = { path = "../centelha-data", optional = true }
pulldown-cmark = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
hydration_context = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "DomStringMap", "Element", "HtmlElement", "Performance", "Storage", "Window"] }

[lints]
workspace = true
