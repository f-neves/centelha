[package]
name = "centelha-web"
description = "O site: páginas do livro geradas em HTML no build e ilhas de interatividade em WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# O gerador do site estático (grava dist/). Só existe com a feature `ssr`.
[[bin]]
name = "centelha-site"
path = "src/bin/site.rs"
required-features = ["ssr"]

# Prova 1 do ADR 0003: cada página tem o texto inteiro sem WebAssembly.
[[test]]
name = "full_text"
path = "tests/full_text.rs"
required-features = ["ssr"]

[features]
# Sem features padrão; `ssr` e `hydrate` nunca juntas.
ssr = ["leptos/ssr", "dep:centelha-data", "dep:centelha-engine", "dep:pulldown-cmark", "dep:sha1", "dep:hydration_context"]
hydrate = ["leptos/hydrate", "dep:centelha-engine", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
leptos = { workspace = true, features = ["islands"] }
centelha-data = { path = "../centelha-data", optional = true }
centelha-engine = { path = "../centelha-engine", optional = true }
pulldown-cmark = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
hydration_context = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
# A mesma versão que o Leptos já traz (Cargo.lock): as promessas do Pagefind na busca.
wasm-bindgen-futures = { version = "=0.4.80", optional = true }
web-sys = { workspace = true, optional = true, features = ["CssStyleDeclaration", "Document", "DomRect", "DomStringMap", "DomTokenList", "Element", "Event", "EventTarget", "FocusEvent", "HtmlCollection", "CustomEvent", "CustomEventInit", "HtmlDetailsElement", "HtmlDialogElement", "History", "HtmlElement", "HtmlInputElement", "HtmlTableElement", "HtmlTableRowElement", "HtmlTableSectionElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Node", "NodeList", "Performance", "Response", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollToOptions", "Storage", "Window", "console"] }

[lints]
workspace = true
