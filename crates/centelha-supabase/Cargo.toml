[package]
name = "centelha-supabase"
description = "Cliente tipado do Supabase: tabelas, funções, arquivos e tempo real."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Versões conferidas no crates.io em 26/11/2026.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.8.0", default-features = false, features = ["http"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[lints]
workspace = true
