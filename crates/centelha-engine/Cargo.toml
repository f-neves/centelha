[package]
name = "centelha-engine"
description = "Regras puras do jogo: ficha, criaturas, combate, tempo, Artes e a lógica do Grid. Sem IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
centelha-data = { path = "../centelha-data" }
# log10 e pow com a mesma conta no nativo e no WebAssembly
libm = { version = "0.2.16", default-features = false }
# a ficha do jogador entra como JSON (dado do jogador, em formas de várias
# épocas); preserve_order guarda a ordem das chaves, que o TypeScript usa
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
# Só para ler as referências de paridade nos testes.
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
