# Integração contínua: formatação, clippy, testes (com a paridade), build
# para WebAssembly e a varredura anti-rastro. Não busca nenhum outro
# repositório: a paridade confere contra as referências gravadas em tests/parity/.
#
# Versões das actions conferidas nas páginas de release em 25/11/2026:
# actions/checkout v7.0.1, Swatinem/rust-cache v2.9.3.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7.0.1
        with:
          # Histórico inteiro: a varredura lê as mensagens de todos os commits.
          fetch-depth: 0

      - name: Instalar o Rust (versão do rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache de compilação
        uses: Swatinem/rust-cache@v2.9.3

      - name: Formatação
        run: cargo fmt --all --check

      - name: Varredura anti-rastro
        run: cargo xtask scan

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

      # A paridade já roda dentro de "Testes"; este passo a repete com nome
      # próprio para o resultado aparecer separado. Fica verde e avisa
      # enquanto o teste ainda não existe.
      - name: Paridade
        shell: bash
        run: |
          if ls crates/*/tests/parity.rs >/dev/null 2>&1; then
            cargo test --workspace --test parity
          else
            echo "::notice::teste de paridade ainda não existe (crates/*/tests/parity.rs)"
          fi

      - name: Build para WebAssembly
        run: cargo build -p centelha-engine -p centelha-data --target wasm32-unknown-unknown
