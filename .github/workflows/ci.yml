# Integração contínua: formatação, clippy, testes (com a paridade), build
# para WebAssembly e a varredura anti-rastro. Não busca nenhum outro
# repositório: a paridade confere contra as referências gravadas em tests/parity/.
#
# Versões das actions conferidas nas páginas de release em 25/11/2026:
# actions/checkout v7.0.1, Swatinem/rust-cache v2.9.3; em 26/11/2026:
# actions/cache v6.1.0, actions/setup-node v7.1.0; actions/upload-artifact
# v7.0.2 conferida em 26/11/2026.
#
# Cache do Cargo: só o push no main grava (save-if). Os PRs restauram o cache
# do main e não gravam o próprio, para o total ficar abaixo dos 10 GB do
# GitHub. A prévia restaura o cache do job "Site" e também não grava.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Em PR, um push novo cancela a verificação anterior. No main, não: cada
  # commit que entra fica com a sua verificação.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7.0.1
        with:
          # Histórico inteiro: a varredura lê as mensagens de todos os commits.
          fetch-depth: 0

      - name: Instalar o Rust (versão do rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache de compilação
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatação
        run: cargo fmt --all --check

      - name: Varredura anti-rastro
        run: cargo xtask scan

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

      # A paridade já roda dentro de "Testes"; este passo a repete com nome
      # próprio. Falha se não houver nenhum `tests/parity_*.rs`.
      - name: Paridade
        shell: bash
        run: |
          if ! ls crates/*/tests/parity_*.rs >/dev/null 2>&1; then
            echo "::error::nenhum teste de paridade (crates/*/tests/parity_*.rs)"
            exit 1
          fi
          cargo test --workspace --test 'parity_*'

      - name: Build para WebAssembly
        run: cargo build -p centelha-engine -p centelha-data --target wasm32-unknown-unknown

      # O cliente do Supabase também roda no navegador: o clippy no wasm32
      # pega dependência ou código que só compila no nativo.
      - name: Clippy do cliente do Supabase (WebAssembly)
        run: cargo clippy -p centelha-supabase --target wasm32-unknown-unknown -- -D warnings

  # O site (centelha-web): clippy e testes de cada lado (gerador nativo com
  # `ssr`, ilhas no navegador com `hydrate`), a montagem do `dist/` e a prova
  # de hidratação num Chrome sem janela, em release e em depuração (ADR 0003).
  # Job próprio, em paralelo ao "Verificar", com o cache do Cargo à parte:
  # os conjuntos de features do site não disputam a pasta `target` do outro.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_BASE_PATH: /centelha/
      SITE_SEARCH: "1"
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7.0.1

      - name: Instalar o Rust (versão do rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache de compilação
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: site
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Binários prontos das releases oficiais, com SHA-256 conferido no
      # script; o cache é pela versão (a chave muda quando o script muda).
      - name: Cache das ferramentas do site
        uses: actions/cache@v6.1.0
        with:
          path: ~/.centelha-ferramentas
          key: ferramentas-${{ runner.os }}-${{ hashFiles('tools/ci/ferramentas.sh') }}

      - name: Ferramentas do site (wasm-bindgen, wasm-opt, Pagefind)
        run: |
          sh tools/ci/ferramentas.sh ~/.centelha-ferramentas
          echo "WASM_BINDGEN=$HOME/.centelha-ferramentas/bin/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$HOME/.centelha-ferramentas/bin/wasm-opt" >> "$GITHUB_ENV"
          echo "PAGEFIND=$HOME/.centelha-ferramentas/bin/pagefind" >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Versões do Node e do Chrome
        run: |
          node --version
          google-chrome --version

      - name: Clippy do gerador (ssr)
        run: cargo clippy -p centelha-web --all-targets --features ssr -- -D warnings

      - name: Clippy das ilhas (hydrate, WebAssembly)
        run: cargo clippy -p centelha-web --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings

      - name: Testes do site (inclui a prova 1)
        run: cargo test -p centelha-web --features ssr

      - name: Montar o site (release)
        run: cargo xtask site

      # O tamanho do site no resumo da execução, contra o último main medido.
      # O main guarda a medida no cache (um arquivo pequeno); o PR lê a mais
      # nova pelo prefixo da chave. Só mostra: não falha por tamanho.
      - name: Medida do último main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .tamanho/main.json
          key: tamanho-main-${{ github.sha }}
          restore-keys: tamanho-main-

      - name: Tamanho do site
        run: node tools/ci/tamanho.mjs dist --ref .tamanho/main.json --out .tamanho/atual.json

      - name: Preparar a medida do main
        if: github.ref == 'refs/heads/main'
        run: cp .tamanho/atual.json .tamanho/main.json

      - name: Guardar a medida do main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: .tamanho/main.json
          key: tamanho-main-${{ github.sha }}

      # Todo href e src interno do dist/ cai num arquivo e num id que existem.
      # Link para página ainda não portada só entra na lista do resumo.
      - name: Links internos
        run: node tools/ci/links.mjs dist

      - name: Prova de hidratação (release)
        run: node tools/site/hydration.mjs dist

      # Capturas de página inteira (375 e 1280 px, três temas) num artefato de
      # 7 dias, e a rolagem horizontal a 375 px conferida em todas as páginas
      # (falha o passo). O artefato tem teto: entram as páginas que mudaram
      # contra o último main, inteiras, das menores para as maiores.
      - name: Marcas das páginas do último main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .capturas/main.json
          key: capturas-main-${{ github.sha }}
          restore-keys: capturas-main-

      - name: Capturas e rolagem horizontal
        run: node tools/ci/capturas.mjs dist capturas --ref .capturas/main.json --marcas .capturas/atual.json

      - name: Enviar as capturas
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: capturas
          path: capturas/
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0

      - name: Preparar as marcas do main
        if: github.ref == 'refs/heads/main'
        run: cp .capturas/atual.json .capturas/main.json

      - name: Guardar as marcas do main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: .capturas/main.json
          key: capturas-main-${{ github.sha }}

      - name: Prova das ilhas sem página portada (página de teste fora do dist)
        run: node tools/site/islands-test.mjs dist

      # O índice do Pagefind acha "Iniciativa" no combate com a âncora certa, e
      # a página aberta sem buscar não baixa nada do Pagefind.
      - name: Prova da busca
        run: node tools/ci/busca.mjs dist

      - name: Montar o site (WebAssembly de depuração)
        run: cargo xtask site --dev

      - name: Prova de hidratação (depuração)
        run: node tools/site/hydration.mjs dist
