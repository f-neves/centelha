# Prévia publicada no GitHub Pages do repositório.
#
# O caminho base vem da variável do repositório SITE_BASE_PATH (Settings,
# Secrets and variables, Actions, Variables). Sem a variável, vale
# "/centelha/" (https://f-neves.github.io/centelha/). Quando o domínio
# próprio entrar, basta trocar a variável para "/" e configurar o domínio no
# Pages, sem mexer em código.
#
# Versões das actions conferidas nas páginas de release em 25/11/2026:
# actions/checkout v7.0.1, actions/configure-pages v6.0.0,
# actions/upload-pages-artifact v5.0.0, actions/deploy-pages v5.0.1,
# Swatinem/rust-cache v2.9.3; em 26/11/2026: actions/cache v6.1.0.
name: Prévia (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões por job: montar só lê o repositório; publicar escreve no Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/centelha/' }}
  SITE_SEARCH: "1"

jobs:
  montar:
    name: Montar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7.0.1

      - name: Configurar o Pages
        uses: actions/configure-pages@v6.0.0

      - name: Instalar o Rust (versão do rust-toolchain.toml)
        run: rustup toolchain install

      # O mesmo cache do job "Site" do CI: o build de release já vem pronto.
      - name: Cache de compilação
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: site

      - name: Cache das ferramentas do site
        uses: actions/cache@v6.1.0
        with:
          path: ~/.centelha-ferramentas
          key: ferramentas-${{ runner.os }}-${{ hashFiles('tools/ci/ferramentas.sh') }}

      - name: Ferramentas do site (wasm-bindgen, wasm-opt, Pagefind)
        run: |
          sh tools/ci/ferramentas.sh ~/.centelha-ferramentas
          echo "WASM_BINDGEN=$HOME/.centelha-ferramentas/bin/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$HOME/.centelha-ferramentas/bin/wasm-opt" >> "$GITHUB_ENV"
          echo "PAGEFIND=$HOME/.centelha-ferramentas/bin/pagefind" >> "$GITHUB_ENV"

      # O site inteiro em dist/, com o SITE_BASE_PATH do topo.
      - name: Montar o site
        run: |
          cargo xtask site
          touch dist/.nojekyll

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  publicar:
    name: Publicar
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
