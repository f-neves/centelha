[package]
name = "card"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "=0.8.23"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Location"] }

[features]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate", "dep:js-sys"]
# exports the `hydrate` entry point (off when another crate provides its own)
entry = ["hydrate"]
