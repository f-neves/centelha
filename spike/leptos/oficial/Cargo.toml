[package]
name = "oficial"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
card = { path = "../card" }
leptos = "=0.8.23"
leptos_router = "=0.8.17"
leptos_axum = { version = "=0.8.10", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"

[features]
hydrate = ["leptos/hydrate", "card/hydrate"]
ssr = ["dep:leptos_axum", "dep:axum", "dep:tokio", "leptos/ssr", "leptos_router/ssr", "card/ssr"]

[profile.release]
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.leptos]
output-name = "oficial"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3017"
reload-port = 3018
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
